name: Test architecture full gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm
      - run: npm ci
      - run: npm run test:full
